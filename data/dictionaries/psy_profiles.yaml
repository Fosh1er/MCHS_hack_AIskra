# Каталог психологических профилей заявителя (п. 3.7, ADR-0012).
# Предметная основа — docs/research/psychology/06_Каталог_состояний_заявителя.md; коды действий оператора —
# 05_Навыки_оператора_и_оценка.md §3. Каталог правит методист; при правке увеличьте version (попадает в снимок звонка).
# Ссылки sources: РФ-N — 01_Источники_РФ.md, М-N.N — 02_Источники_международные.md, О-X — 03_Методы_оценки.
#
# Поля профиля:
#   start / floor           — стартовый уровень ECCS 1–5 и нижняя граница (ниже заявитель не успокоится)
#   deescalate_cost          — сколько «правильных» действий нужно на снижение уровня на 1 (эскалация — сразу)
#   helps / hurts            — вклад действий оператора: helps копят снижение, hurts поднимают уровень сразу
#   critical                 — действия, дающие «не зачтено» блока «Работа с заявителем»
#   gates                    — тема легенды доступна, пока уровень ≤ значения (what доступна всегда)
#   required_routing         — обязательное решение: psy — подключить психолога, service:<код>|<код> — служба в карточке
#   pool                     — с какой сложности сценария профиль попадает в автоподбор; pinned_only — только вручную
#   offline                  — реплики без модели: {base} — ответ по легенде, {short} — его начало, {what},
#                              {opening} — первая реплика легенды; ремарки — только из закрытого списка

version: 1

defaults:
  gates: {what: 5, address: 4, floor: 3, name: 3, phone: 3, victims: 3, danger: 3, access: 2, gas: 2, status: 2}
  dead_air_s: 8
  norm_address_s: 45
  deescalate_cost: 2
  coherence: 0.8
  compliance_cap: 1.0
  can_hang_up: false
  needs_instructions: false
  pool: 3

