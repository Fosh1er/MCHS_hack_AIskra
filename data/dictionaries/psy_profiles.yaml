# Научно-методическая основа (страница «Методика»): официальные источники и что из них взято.
basis:
  - {source: РФ-1, use: "острые реакции на стресс: признаки, помощь, недопустимые действия"}
  - {source: РФ-2, use: "та же методика; прямой запрет пощёчины, воды в лицо и тряски"}
  - {source: РФ-13, use: "оценивать и учитывать психологическое состояние заявителя; ТФ C/04.6 — аудиоконтроль речи оператора"}
  - {source: РФ-6, use: "речевой стандарт: короткие фразы, без частицы «не» и слов «паника», «ужас»"}
  - {source: РФ-10, use: "нормативы: ответ до 20 с, психологическая поддержка до 30 мин"}
  - {source: РФ-11, use: "«Основы психологии» и «Культура речевого общения» в подготовке операторов 112"}
  - {source: М-0.1, use: "шкала состояния заявителя 1–5: от спокойного до неуправляемого"}
  - {source: М-1.1, use: "контроль качества звонка: спокойствие, контроль разговора, без долгих пауз"}
  - {source: М-1.2, use: "повторная настойчивость, понятная речь без служебных кодов"}
  - {source: М-1.4, use: "суицидальные высказывания: спросить прямо, не класть трубку первым"}

profiles:
  panic:
    title: Страх, паника
    group: stress_reaction
    direction: up
    start: 4
    floor: 1
    deescalate_cost: 2
    coherence: 0.6
    pool: 3
    needs_instructions: true
    key_acts: [PRESENCE, REPEAT_PERSIST, INFO_HELP, BREATHING]
    helps: {PRESENCE: 1, INFO_HELP: 1, BREATHING: 1, REPEAT_PERSIST: 1, ASK_CLOSED: 0.5, ACK_EMOTION: 0.5, NAME_USE: 0.5, INSTRUCT: 0.5, AFFIRM: 0.5}
    hurts: {CALM_DOWN: 1, DEVALUE: 1, TRIGGER_WORD: 1, RUDE: 2, BLAME: 1, THREAT_HANGUP: 2, REASK_KNOWN: 1, DEAD_AIR: 1, FALSE_PROMISE: 0.5}
    critical: [THREAT_HANGUP]
    triggers:
      - {at_s: 90, if_level_ge: 3, delta: 1, note: "обстановка ухудшается"}
    speech:
      5: "Кричит «помогите», повторяет одно и то же, обрывает фразы, на вопросы почти не отвечает."
      4: "Короткие сбивчивые фразы, повторы «скорее, скорее», частое дыхание; адрес называет по частям."
      3: "Сбивается и торопит, но отвечает на вопросы."
      2: "Взволнован, отвечает, иногда переспрашивает."
      1: "Говорит спокойно и по делу."
    offline:
      opening: ["[задыхается] Алло! Алло! Помогите! {opening}", "[тяжело дышит] Скорее! {opening}"]
      "5": ["[кричит] Помогите! Помогите, быстрее!", "[задыхается] Я не могу… тут {what}!"]
      "4": ["[тяжело дышит] {short}… скорее!", "{base} Быстрее, пожалуйста, быстрее!"]
      "3": ["{base} Пожалуйста, быстрее…", "[тяжело дышит] {base}"]
      "2": ["{base}", "{base} Когда приедут?"]
      "1": ["{base}"]
      refuse: ["Я не знаю! Не знаю! Приезжайте!", "[задыхается] Я не помню… не могу сообразить…", "Какая разница?! Быстрее!"]
    voice: {nonverbal: [pant, gasp]}
    sources: [РФ-1, РФ-4, РФ-7, М-0.1, М-4.2, О-E1]

  crying:
    title: Плач
    group: stress_reaction
    direction: down
    start: 3
    floor: 1
    deescalate_cost: 2
    coherence: 0.8
    pool: 1
    dead_air_s: 12
    key_acts: [PRESENCE, ACK_EMOTION, REDIRECT]
    helps: {PRESENCE: 1, ACK_EMOTION: 1, REDIRECT: 0.5, INFO_HELP: 0.5, ASK_CLOSED: 0.5, NAME_USE: 0.5, AFFIRM: 0.5}
    hurts: {CALM_DOWN: 1, DEVALUE: 1, BLAME: 1, RUDE: 2, THREAT_HANGUP: 2, REASK_KNOWN: 1}
    critical: [THREAT_HANGUP]
    gates: {address: 4, floor: 3, name: 3, victims: 4}
    speech:
      5: "Рыдает, слова тонут в плаче, почти ничего нельзя разобрать."
      4: "Плачет, фразы обрываются, долгие всхлипы между словами."
      3: "Всхлипывает, говорит медленно, с паузами, голос дрожит."
      2: "Голос дрожит, иногда всхлипывает, но отвечает."
      1: "Успокоилась, говорит тихо и по делу."
    offline:
      opening: ["[плачет] Алло… {opening}", "[всхлипывает] Помогите, пожалуйста… {opening}"]
      "5": ["[плачет] Я… я не могу…", "[плачет] Господи…"]
      "4": ["[плачет] {short}…", "[всхлипывает] {base}"]
      "3": ["[всхлипывает] {base}", "{base} [всхлипывает]"]
      "2": ["{base}", "[всхлипывает] {base}"]
      "1": ["{base}"]
      refuse: ["[плачет] Подождите… я не могу сейчас…", "[всхлипывает] Я не знаю… не помню…"]
    voice: {nonverbal: [sob, sniff]}
    sources: [РФ-1, РФ-2, РФ-4, РФ-28]

  hysteria:
    title: Истероидная реакция
    group: stress_reaction
    direction: up
    start: 5
    floor: 2
    deescalate_cost: 3
    coherence: 0.5
    pool: 4
    can_hang_up: true
    key_acts: [NAME_USE, REPEAT_PERSIST, INSTRUCT, ASK_OTHER]
    helps: {REPEAT_PERSIST: 1, NAME_USE: 1, INSTRUCT: 1, ASK_OTHER: 1, ASK_CLOSED: 0.5, PRESENCE: 0.5, INFO_HELP: 0.5}
    hurts: {CALM_DOWN: 1, BLAME: 1, ARGUE: 1, RUDE: 2, THREAT_HANGUP: 2, DEVALUE: 1, FALSE_ADVICE: 1, REASK_KNOWN: 1}
    critical: [FALSE_ADVICE, THREAT_HANGUP]
    gates: {address: 4, floor: 3, name: 3, victims: 3}
    speech:
      5: "Кричит и рыдает одновременно, обращается к людям вокруг, вопросы почти не слышит, «театральна»."
      4: "Громко, быстро, перебивает, отвечает не на тот вопрос, требует «просто приезжайте»."
      3: "Всё ещё громко и эмоционально, но слышит короткие вопросы."
      2: "Обессилена после вспышки, говорит тихо и медленно."
      1: "Говорит спокойно."
    offline:
      opening: ["[кричит] Алло?! Вы там что, спите?! {opening}", "[кричит] Люди! Да сделайте что-нибудь! {opening}"]
      "5": ["[кричит] Да приезжайте уже! Что вы спрашиваете?!", "[кричит] Вы слышите меня?! Тут {what}!", "[плачет] [кричит] Ну почему никто ничего не делает?!"]
      "4": ["[кричит] {base} Быстрее!", "Я же вам говорю! {short}!"]
      "3": ["{base} Ну быстрее же!", "[всхлипывает] {base}"]
      "2": ["[тяжело дышит] {base}", "{base}"]
      "1": ["{base}"]
      refuse: ["[кричит] Какая разница?! Приезжайте!", "[кричит] Я не знаю! Вы меня не слышите?!", "[плачет] Не могу я сейчас ничего говорить!"]
    voice: {nonverbal: [scream, sob], scene: crowd}
    sources: [РФ-1, РФ-4, РФ-6, РФ-15, М-0.1, М-6.1]

  aggression:
    title: Агрессия
    group: stress_reaction
    direction: up
    start: 4
    floor: 2
    deescalate_cost: 3
    coherence: 0.8
    compliance_cap: 0.7
    pool: 4
    can_hang_up: true
    key_acts: [NAME_USE, ASK_CHOICE, ACK_EMOTION, INFO_HELP]
