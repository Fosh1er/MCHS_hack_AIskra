# Там же — выжимка и статус проверки. На реестр ссылаются профили (sources), критерии блока оценки
# (assessment/domain/psy_scoring.py:CRITERIA_BASIS) и запрещённые действия (ACT_SOURCES); тесты сверяют коды.
# url не указан, если проверенная копия лежит не у ведомства-автора: текст ищут по названию.
# official: true — официальный документ (ведомство, нормативный акт, отраслевой стандарт).
