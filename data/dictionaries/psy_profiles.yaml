      2: "Успокоился, старается помочь."
      1: "Спокоен."
    offline:
      opening: ["[плачет] Алло… Тётя, тут {what}… мамы нет дома…", "Алло… это сто двенадцать? Тут {what}…"]
      "5": ["[плачет] Мама! Я боюсь!"]
      "4": ["[всхлипывает] {short}… я боюсь…", "Я не знаю… {short}…"]
      "3": ["{base} Меня не будут ругать?", "{base}"]
      "2": ["{base}", "{base} Я всё правильно делаю?"]
      "1": ["{base}"]
      refuse: ["Я не знаю… Мама знает.", "[всхлипывает] Не помню… тут магазин большой рядом."]
