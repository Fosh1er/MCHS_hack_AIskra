        edges:
          - to: lost_minutes
            when: {card_by_s: 150, service: S103}
            label: "Карточка со скорой ушла вовремя"
            effect: "Бригада начала реанимацию сама"
            source: mz388
          - to: lost
            when: {after_s: 420}
            label: "Карточку в скорую отправили поздно или без неё"
            effect: "Ни реанимации, ни своевременной бригады"
            source: mz388
            note: didactic
      saved:
        title: Ритм восстановлен
        brigade:
          works_completed: "Сердечный ритм восстановлен, пациент госпитализирован."
        outcome:
          code: favorable
          text: "Остановку сердца распознали по телефону, реанимация шла до приезда бригады: ритм восстановлен, пациент госпитализирован."
          sources: [erc2021, mz220, mz388]
      cpr_late:
        title: Реанимация была, скорая — поздно
