# Шаблоны ветвящихся сценариев (F5, ADR-0014). Граф ситуации: узлы, переходы по решениям оператора 112 и ДДС, итоги.
#
# Решения, от которых зависит исход, — те, за которые отвечает оператор системы-112:
#   - быстро получить адрес и отправить карточку нужным службам (ПП РФ № 1931: карточка доступна ДДС в среднем через 75 с);
#   - дать заявителю короткую инструкцию по безопасности из официальной памятки, пока помощь едет;
#   - не дать вредного совета.
# Время развития ситуации (через сколько секунд дым отрежет выход) — учебное упрощение: оно задаёт темп тренировки и
# не является прогнозом реального пожара. Такие переходы помечены `note: didactic`.
#
# Условие перехода — словарь, все ключи должны выполняться (И):
#   said: <инструкция>   — оператор сказал (по основам слов из `instructions`)
#   asked: <тема>        — заявитель уже сообщил тему (address, victims, …; как в domain/actors.py:TOPICS)
#   act: <код>           — действие оператора из словаря модификатора (domain/psy.py:ALL_ACTS)
#   after_s: N           — прошло N с от ответа на вызов
#   card_by_s: N         — карточка 112 сохранена не позже N с от ответа
#   service: <код>       — в сохранённой карточке есть служба
#   dds: <статус>        — служба карточки дошла до статуса (arrived, works_in_progress, …)
#   ended: true          — разговор завершён
# Переходы узла проверяются по порядку, срабатывает первый выполненный.
# Плейсхолдеры в текстах: {floor} — этаж из легенды.
version: 1

sources:
  pp1931:
    title: "Постановление Правительства РФ от 12.11.2021 № 1931, п. 9 «р»: карточка доступна ДДС в среднем через 75 с, ДДС подтверждает приём не позже чем через 30 с"
    url: "https://base.garant.ru/403052132/"
  fz123:
    title: "Федеральный закон от 22.07.2008 № 123-ФЗ «Технический регламент о требованиях пожарной безопасности», ст. 76: первое пожарное подразделение в городе прибывает не позднее 10 мин"
    url: "https://base.garant.ru/12161584/ef67419dbaa01e4d228acc1d3cf42314/"
  mchs_fire:
    title: "МЧС России. «Пожар в квартире»: закройте за собой двери, лифтом не пользуйтесь; если выйти нельзя — заткните щели мокрой тканью, закройте вентиляцию"
    url: "https://mchs.gov.ru/deyatelnost/bezopasnost-grazhdan/pozhar-v-kvartire_4"
  mchs_fire_windows:
    title: "ГУ МЧС России по Камчатскому краю. «Пожар в квартире или офисе»: открывать окна при пожаре нельзя — приток воздуха усиливает пламя"
    url: "https://41.mchs.gov.ru/deyatelnost/poleznaya-informaciya/pozharnaya-bezopasnost/rekomendacii-pamyatki-po-deystviyam/pozhar-v-kvartire-ili-ofise"
  mz220:
    title: "Приказ Минздрава России от 03.05.2024 № 220н «Об утверждении Порядка оказания первой помощи»: сердечно-лёгочная реанимация, остановка кровотечения; извлечение и перемещение пострадавшего — после устранения угрозы"
    url: "https://www.consultant.ru/document/cons_doc_LAW_477698/"
  mz388:
    title: "Приказ Минздрава России от 20.06.2013 № 388н «Порядок оказания скорой медицинской помощи»: доезд бригады в экстренной форме — не более 20 мин"
    url: "https://base.garant.ru/70438200/"
  mchs_cpr:
    title: "ГУ МЧС России по Архангельской области. «Сердечно-лёгочная реанимация»: давление на грудину 100–120 раз в минуту до прибытия скорой"
    url: "https://29.mchs.gov.ru/deyatelnost/bezopasnost-grazhdan/serdechno-legochnaya-reanimaciya"
  erc2021:
    title: "European Resuscitation Council Guidelines 2021, Systems Saving Lives: диспетчер распознаёт остановку сердца (нет сознания, нет нормального дыхания) и ведёт реанимацию по телефону"
    url: "https://cprguidelines.eu/"
  minstroy1614:
    title: "Приказ Минстроя России от 05.12.2017 № 1614/пр «Инструкция по безопасному использованию газа при удовлетворении коммунально-бытовых нужд»"
    url: "http://publication.pravo.gov.ru/Document/View/0001201804280052"
  mchs_gas:
    title: "ГУ МЧС России по Московской области. «Если вы почувствовали запах газа в квартире»: перекройте газ, откройте окна, выведите людей, вызовите газовую службу с улицы"
    url: "https://50.mchs.gov.ru/deyatelnost/poleznaya-informaciya/rekomendacii-naseleniyu/4-pamyatki-po-pozharnoy-bezopasnosti/esli-vy-pochuvstvovali-zapah-gaza-v-kvartire"
  pdd:
    title: "Правила дорожного движения РФ (ПП РФ от 23.10.1993 № 1090), п. 2.5–2.6: аварийная сигнализация, знак аварийной остановки, первая помощь пострадавшим, вызов скорой и полиции"
    url: "https://www.consultant.ru/document/cons_doc_LAW_2709/a4b879c29ebc2ff9a56a0595499b6eb2dce7980e/"

templates:
  # ------------------------------------------------------------------ пожар в квартире
  fire_flat:
    title: Пожар в квартире
    description: "Горит кухня, в квартире заявитель с ребёнком. Решают скорость карточки в пожарную охрану и инструкция «выйти и закрыть дверь» до того, как дым отрежет выход."
    incident_codes: ["1050101", "1050102"]
    horizon_s: 600
    legend:
      opening: "Алло! У нас пожар, кухня горит, дым по всей квартире! Со мной сын маленький!"
      what: "Горит кухня, дым идёт по квартире. В квартире я и сын семи лет."
      details: "Загорелось масло на плите, пламя перекинулось на шкаф."
      facts:
        danger: "Горит кухня, дым уже в коридоре квартиры."
        access: "Мы в комнате, входная дверь рядом, пока можно выйти."
      victims: {has: false, count: 0}
    instructions:
      evacuate:
        title: "Выйти из квартиры с ребёнком, закрыть за собой дверь, лифтом не пользоваться"
        stems: ["выходите", "выйдите", "уходите", "покиньте", "выведите", "закройте за собой", "лифтом не", "не пользуйтесь лифт", "без лифта", "по лестниц"]
        source: mchs_fire
      shelter:
        title: "Если выйти нельзя: закрыться в комнате, заткнуть щели мокрой тканью, закрыть вентиляцию, ждать пожарных"
        stems: ["мокр", "щели", "заткните", "вентиляц", "закройтесь", "закрыться в комнат"]
        source: mchs_fire
      open_window:
        title: "«Откройте окна» — приток воздуха усиливает пламя"
        stems: ["откройте окн", "открыть окн", "откройте форточ", "распахните окн", "проветр"]
        harmful: true
        source: mchs_fire_windows
    start: start
    nodes:
      start:
        title: Горит кухня
        situation: "Горит кухня, дым идёт по квартире. Заявитель с ребёнком в комнате, выйти на лестницу пока можно."
        edges:
          - to: out
            when: {said: evacuate}
            label: "Велели выйти с ребёнком и закрыть за собой дверь"
            effect: "Заявитель с сыном вышли на лестницу, закрытая дверь задерживает огонь и дым"
            source: mchs_fire
          - to: trapped
            when: {said: open_window}
            label: "Посоветовали открыть окна"
            effect: "Приток воздуха раздул пламя, огонь вышел в коридор и отрезал выход"
            source: mchs_fire_windows
          - to: trapped
            when: {after_s: 120}
            label: "Инструкции по эвакуации не было 2 минуты"
            effect: "Дым заполнил коридор, выйти из квартиры уже нельзя"
            source: mchs_fire
            note: didactic
      trapped:
        title: Выход отрезан дымом
        situation: "Коридор в чёрном дыму, огонь вышел из кухни. Заявитель с ребёнком закрылись в дальней комнате, выйти не могут, ребёнок кашляет."
        event: "Мы не можем выйти — в коридоре чёрный дым! Мы в комнате, сын кашляет!"
        escalate: 1
        gates: [danger, access]
        facts:
          danger: "В коридоре чёрный дым, огонь уже не только на кухне."
          access: "Выйти не можем, закрылись в дальней комнате."
        edges:
          - to: sheltered
            when: {said: shelter}
            label: "Научили укрыться: мокрая ткань в щели, закрыть вентиляцию, ждать у окна"
            effect: "Дым почти не проникает в комнату, заявитель с сыном ждут пожарных"
            source: mchs_fire
          - to: poisoned
            when: {after_s: 300}
            label: "Как укрыться от дыма, не объяснили"
            effect: "Дым проник в комнату"
            source: mchs_fire
            note: didactic
      out:
        title: Люди вышли, дверь закрыта
        situation: "Заявитель с сыном на лестнице, дверь квартиры закрыта, огонь пока внутри квартиры. Ждут пожарных на улице."
        event: "Всё, мы вышли, дверь закрыла. Спускаемся по лестнице."
        escalate: -1
        facts:
          danger: "Горит в квартире, мы вышли и закрыли дверь."
          access: "Мы на лестнице, спускаемся на улицу."
        brigade:
          arrived: "Прибыли. Жильцы вышли, дверь квартиры закрыта, горение на кухне — приступаем к тушению."
          works_in_progress: "Тушим кухню, распространения нет."
        edges:
          - to: contained
            when: {card_by_s: 150, service: S101}
            label: "Карточка с пожарной охраной ушла вовремя"
            effect: "Пожарные успели до распространения огня"
            source: pp1931
          - to: spread
            when: {after_s: 300}
            label: "Карточку в пожарную охрану отправили поздно или без неё"
            effect: "Пожарные приехали позже — огонь перекинулся на соседнюю квартиру"
            source: fz123
            note: didactic
      sheltered:
        title: Укрылись в комнате
        situation: "Заявитель с сыном в комнате, щели заткнуты мокрой тканью, вентиляция закрыта. Дышат у окна, ждут пожарных."
        event: "Заткнула щели мокрым полотенцем… Дыма меньше. Мы у окна."
        escalate: -1
        facts:
          danger: "В квартире дым, мы закрылись в комнате, щели заткнули."
          access: "Выйти не можем, ждём у окна."
        brigade:
          arrived: "Прибыли. В квартире люди, закрылись в комнате — проводим спасение по лестнице."
          works_in_progress: "Людей вывели, тушим квартиру."
        edges:
          - to: rescued
            when: {card_by_s: 180, service: S101}
            label: "Карточка с пожарной охраной ушла вовремя"
            effect: "Пожарные вывели людей до того, как дым проник в комнату"
            source: pp1931
          - to: poisoned
            when: {after_s: 420}
            label: "Карточку в пожарную охрану отправили поздно или без неё"
            effect: "Помощь задержалась, дым проник в комнату"
            source: fz123
            note: didactic
      contained:
        title: Пожар потушен в квартире
        brigade:
          arrived: "Прибыли. Жильцы на улице, горит кухня, дверь закрыта — тушим, распространения нет."
          works_completed: "Пожар ликвидирован в пределах кухни, пострадавших нет."
        outcome:
          code: favorable
          text: "Заявитель с сыном вышли и закрыли дверь, пожарные приехали вовремя: пожар потушен в пределах квартиры, пострадавших нет."
          sources: [mchs_fire, pp1931, fz123]
      spread:
        title: Огонь перекинулся на соседнюю квартиру
        brigade:
          arrived: "Прибыли. Горит квартира и соседняя по площадке, прошу дополнительные силы."
          works_completed: "Пожар ликвидирован, выгорели две квартиры. Пострадавших нет."
        outcome:
          code: partial
          text: "Люди вышли, но карточка в пожарную охрану ушла поздно: огонь перекинулся на соседнюю квартиру."
          sources: [pp1931, fz123]
      rescued:
        title: Людей вывели пожарные
        brigade:
          works_completed: "Людей вывели без отравления, пожар ликвидирован, квартира выгорела."
        outcome:
          code: partial
          text: "Выход отрезало, но заявитель с сыном укрылись по инструкции и дождались пожарных без отравления. Квартира выгорела."
          sources: [mchs_fire, pp1931]
      poisoned:
        title: Отравление дымом
        brigade:
          arrived: "Прибыли. Двое в задымлённой квартире, выносим, нужна скорая."
          works_completed: "Двоих вынесли с отравлением продуктами горения, переданы скорой."
        outcome:
          code: adverse
          text: "Выход отрезало, а как защититься от дыма, заявитель не знал: заявителя и ребёнка вынесли с отравлением продуктами горения."
          sources: [mchs_fire, fz123]
    checks:
      ideal: {asked: {address: 15}, said: {evacuate: 40}, card: {saved_s: 80, services: [S101]}, expect: favorable}
      late_card: {asked: {address: 20}, said: {evacuate: 60}, card: {saved_s: 240, services: [S101]}, expect: partial}
      sheltered: {asked: {address: 20}, said: {shelter: 150}, card: {saved_s: 100, services: [S101]}, expect: partial}
      open_window: {asked: {address: 20}, said: {open_window: 50}, card: {saved_s: 100, services: [S101]}, expect: adverse}
      silent: {asked: {address: 30}, expect: adverse}

  # ------------------------------------------------------------------ остановка дыхания и сердца
  cardiac_arrest:
    title: Остановка дыхания и сердца
    description: "Мужчина упал дома и не отвечает, дыхание редкое и хриплое — это остановка сердца. Решают вопрос о дыхании, инструкция по непрямому массажу сердца и быстрая карточка в скорую."
    incident_codes: ["22020000"]
    horizon_s: 720
    legend:
      opening: "Алло! Мужу плохо, он упал на кухне и не отвечает! Что делать?!"
      what: "Муж упал на кухне и не отвечает, глаза закрыты."
      details: "Ему 62 года, жаловался на боль в груди."
      facts:
        danger: "Он лежит на полу и не отвечает."
      victims: {has: true, count: 1}
      applicant: {status: relative}
    instructions:
      check_breathing:
        title: "Проверить дыхание: грудь поднимается? дышит нормально?"
        stems: ["дышит", "дыхани", "грудь поднима", "грудная клетка"]
        source: erc2021
      cpr:
        title: "Непрямой массаж сердца: ладони на середину груди, давить сильно и часто, 100–120 раз в минуту, до приезда скорой"
        stems: ["массаж сердц", "надавлив", "давите", "нажимайте", "на грудин", "середину груд", "центр груд", "реанимац", "100 раз", "сто раз", "сильно и часто"]
        source: mz220
      wrong_aid:
        title: "Хлопать по щекам, давать воду или нашатырь вместо реанимации"
        stems: ["по щекам", "дайте вод", "дайте попить", "нашатыр", "подушку под голов", "потрясите", "трясите", "облейте вод"]
        harmful: true
        source: mz220
    start: start
    nodes:
      start:
        title: Мужчина без сознания
        situation: "Муж заявительницы лежит на полу кухни, не отвечает. Дыхание редкое и хриплое — заявительница не понимает, что это значит."
        edges:
          - to: cpr
            when: {said: cpr}
            label: "Сразу начали реанимацию по телефону"
            effect: "Заявительница давит на грудину, кровообращение поддерживается до приезда скорой"
            source: erc2021
          - to: no_breath
            when: {said: check_breathing}
            label: "Спросили, дышит ли он нормально"
            effect: "Выяснили: дыхание редкое и хриплое — это признак остановки сердца"
            source: erc2021
          - to: wrong
            when: {said: wrong_aid}
            label: "Посоветовали хлопать по щекам или дать воды"
            effect: "Время уходит на бесполезные действия"
            source: mz220
          - to: no_breath
            when: {after_s: 90}
            label: "О дыхании не спросили полторы минуты"
            effect: "Заявительница сама заметила, что он почти не дышит"
            source: erc2021
            note: didactic
      no_breath:
        title: Дыхания нет
        situation: "Мужчина без сознания, дышит редко и хрипло или не дышит — у него остановка сердца. Заявительница рядом, в панике."
        event: "Он хрипит как-то… редко-редко. Кажется, совсем не дышит!"
        escalate: 1
        gates: [victims, danger]
        facts:
          danger: "Он не дышит, только хрипит редко."
        edges:
          - to: cpr
            when: {said: cpr}
            label: "Научили делать непрямой массаж сердца"
            effect: "Заявительница давит на грудину, кровообращение поддерживается до приезда скорой"
            source: mz220
          - to: wrong
            when: {said: wrong_aid}
            label: "Посоветовали хлопать по щекам или дать воды"
            effect: "Время уходит на бесполезные действия"
            source: mz220
          - to: no_cpr
            when: {after_s: 240}
            label: "Реанимацию по телефону не начали"
            effect: "До приезда скорой кровообращения нет"
            source: erc2021
            note: didactic
      wrong:
        title: Бесполезные действия
        situation: "Заявительница хлопает мужа по щекам и пытается напоить — он не реагирует и не дышит."
        event: "Хлопаю по щекам — не реагирует! Воду не пьёт!"
        escalate: 1
        facts:
          danger: "Он не реагирует и не дышит."
        edges:
          - to: cpr
            when: {said: cpr}
            label: "Исправились и научили делать непрямой массаж сердца"
            effect: "Реанимация началась, хоть и позже"
            source: mz220
          - to: no_cpr
            when: {after_s: 240}
            label: "Реанимацию по телефону не начали"
            effect: "До приезда скорой кровообращения нет"
            source: erc2021
            note: didactic
      cpr:
        title: Реанимация по телефону
        situation: "Заявительница делает непрямой массаж сердца по инструкции оператора и считает вслух, телефон на громкой связи."
        event: "Хорошо… давлю… раз, два, три, четыре…"
        escalate: -1
        gates: [victims]
        facts:
          danger: "Делаю массаж сердца, как вы сказали."
        brigade:
          arrived: "Прибыли. Родственница проводит массаж сердца, продолжаем реанимацию."
        edges:
          - to: saved
            when: {card_by_s: 150, service: S103}
            label: "Карточка со скорой ушла вовремя"
            effect: "Бригада приехала, пока шла реанимация"
            source: mz388
          - to: cpr_late
            when: {after_s: 420}
            label: "Карточку в скорую отправили поздно или без неё"
            effect: "Заявительница устала, массаж ослаб до приезда бригады"
            source: mz388
            note: didactic
      no_cpr:
        title: Ждут скорую без реанимации
        situation: "Мужчина не дышит, массаж сердца никто не делает. Заявительница ждёт скорую."
        event: "Он совсем не шевелится… Где скорая?!"
        escalate: 1
        brigade:
