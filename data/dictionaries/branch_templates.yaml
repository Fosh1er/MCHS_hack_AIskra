  # ------------------------------------------------------------------ запах газа в квартире
  gas_leak:
    title: Запах газа в квартире
    description: "Пожилая заявительница чувствует сильный запах газа на кухне и собирается включить свет. Решают инструкция «не включайте свет, перекройте газ», выход из квартиры и газовая служба в карточке."
    incident_codes: ["13020201", "13020100"]
    horizon_s: 600
    legend:
      opening: "Алло, у меня на кухне очень сильно пахнет газом! Что мне делать?"
      what: "На кухне сильно пахнет газом, конфорки вроде выключены."
      details: "Живу одна, плита старая."
      facts:
        gas: "Дом газифицирован, на кухне сильный запах газа."
        danger: "Пахнет газом всё сильнее."
      victims: {has: false, count: 0}
      applicant: {status: victim}
    instructions:
      safety:
        title: "Перекрыть газ, открыть окна, не включать и не выключать свет и приборы, не зажигать огонь"
        stems: ["перекройте", "закройте кран", "выключите газ", "откройте окн", "проветр", "не включайте", "не выключайте", "не зажигайте", "не курите", "спички"]
        source: minstroy1614
      no_light:
        title: "Не трогать выключатель: искра может воспламенить газ"
        stems: ["не включ", "не трогайте выключател", "не нажимайте", "свет не", "выключатель не", "не зажигайте"]
        source: minstroy1614
      leave:
        title: "Выйти из квартиры, закрыть дверь, ждать газовую службу на улице"
        stems: ["выйдите", "выходите", "покиньте", "уходите", "на улиц", "на лестниц"]
        source: mchs_gas
    start: start
    nodes:
      start:
        title: Сильный запах газа
        situation: "На кухне сильный запах газа, источник не найден. Заявительница одна, на кухне темно."
        edges:
          - to: safe
            when: {said: safety}
            label: "Сразу дали инструкцию: газ перекрыть, окна открыть, свет не трогать"
            effect: "Заявительница перекрыла газ и проветривает, ничего не включает"
            source: minstroy1614
          - to: about_light
            when: {after_s: 40}
            label: "Инструкции по безопасности не было 40 с"
            effect: "Заявительница собирается включить свет на кухне"
            source: minstroy1614
            note: didactic
      about_light:
        title: Хочет включить свет
        situation: "Заявительница стоит у выключателя на загазованной кухне и собирается включить свет, чтобы найти утечку."
        event: "Тут темно… сейчас свет включу, посмотрю, откуда пахнет."
        escalate: 1
        edges:
          - to: safe
            when: {said: no_light}
            label: "Остановили: «не включайте свет»"
            effect: "Заявительница не трогает выключатель"
            source: minstroy1614
          - to: bang
            when: {after_s: 75}
            label: "Не остановили"
            effect: "Искра выключателя воспламенила газ"
            source: minstroy1614
            note: didactic
      safe:
        title: Газ перекрыт
        situation: "Заявительница перекрыла газ и открыла окна, ничего не включает. Она всё ещё на кухне."
        event: "Хорошо, газ перекрыла, окна открываю. Ничего не включаю."
        escalate: -1
        facts:
          danger: "Газ перекрыла, окна открыла, всё ещё пахнет."
        edges:
          - to: outside
            when: {said: leave}
            label: "Велели выйти из квартиры и ждать газовую службу на улице"
            effect: "Заявительница вышла, в квартире никого"
            source: mchs_gas
          - to: stayed
            when: {after_s: 180}
            label: "Не велели выйти из квартиры"
            effect: "Заявительница осталась на загазованной кухне"
            source: mchs_gas
            note: didactic
      stayed:
        title: Осталась на кухне
        situation: "Заявительница так и стоит на кухне, у неё кружится голова."
        event: "Что-то голова кружится… Я пока на кухне."
        escalate: 1
        facts:
          danger: "Голова кружится, я на кухне."
        edges:
          - to: outside
            when: {said: leave}
            label: "Всё-таки велели выйти на улицу"
            effect: "Заявительница вышла, хоть и с головокружением"
            source: mchs_gas
          - to: poisoned
            when: {after_s: 300}
            label: "Так и не велели выйти"
            effect: "Заявительница надышалась газом"
            source: mchs_gas
            note: didactic
      outside:
        title: Заявительница на улице
        situation: "Заявительница вышла из квартиры и ждёт газовую службу у подъезда."
        event: "Я вышла, дверь закрыла. Жду у подъезда."
        escalate: -1
        facts:
          danger: "Я на улице, в квартире газ."
        brigade:
          arrived: "Прибыли. В квартире никого, газ перекрыт — ищем утечку."
        edges:
          - to: fixed
            when: {card_by_s: 150, service: S104}
            label: "Карточка с газовой службой ушла вовремя"
            effect: "Газовая служба быстро нашла утечку"
            source: pp1931
          - to: late
            when: {after_s: 420}
            label: "Газовую службу в карточку не включили или отправили поздно"
            effect: "Утечку искали дольше"
            source: pp1931
            note: didactic
      fixed:
        title: Утечка устранена
        brigade:
          works_completed: "Утечка на подводке к плите устранена, квартира проветрена."
        outcome:
          code: favorable
          text: "Газ перекрыт, заявительница вышла, газовая служба быстро нашла и устранила утечку. Пострадавших нет."
          sources: [minstroy1614, mchs_gas, pp1931]
      late:
        title: Газовая служба поздно
        brigade:
          works_completed: "Утечка устранена, подъезд проветрен, газ жильцам включён после проверки."
        outcome:
          code: partial
          text: "Заявительница в безопасности, но газовую службу направили поздно: подъезд проветривали, соседей отключили от газа до вечера."
          sources: [pp1931, mchs_gas]
      poisoned:
        title: Надышалась газом
        brigade:
          arrived: "Прибыли. Жительница на загазованной кухне, плохо себя чувствует — выводим, нужна скорая."
        outcome:
          code: partial
          text: "Заявительницу не вывели из квартиры: её вывели газовики с головокружением и тошнотой, передали скорой."
          sources: [mchs_gas, minstroy1614]
      bang:
        title: Хлопок газа
        brigade:
          arrived: "Прибыли. Хлопок газовоздушной смеси на кухне, горение, пострадавшая — нужна скорая и пожарные."
        outcome:
          code: adverse
          text: "Заявительница включила свет на загазованной кухне: хлопок и пожар, она с ожогами, повреждена соседняя квартира."
          sources: [minstroy1614]
    checks:
      ideal: {asked: {address: 15}, said: {safety: 25, leave: 60}, card: {saved_s: 80, services: [S104]}, expect: favorable}
      late_card: {asked: {address: 20}, said: {safety: 30, leave: 90}, card: {saved_s: 300, services: [S104]}, expect: partial}
      stayed: {asked: {address: 15}, said: {safety: 25}, card: {saved_s: 80, services: [S104]}, expect: partial}
      light: {asked: {address: 15}, card: {saved_s: 70, services: [S104]}, expect: adverse}

  # ------------------------------------------------------------------ ДТП с пострадавшими
  dtp_victims:
    title: ДТП с пострадавшими
    description: "Свидетель остановился у ДТП: водитель зажат в машине, кровь на ноге. Решают безопасность самого заявителя на дороге, первая помощь без перемещения пострадавшего и скорая в карточке."
    incident_codes: ["2020300", "2020000"]
    horizon_s: 720
    legend:
      opening: "Алло! Тут авария, машина в столб врезалась, водитель внутри, у него кровь!"
      what: "Легковая машина врезалась в столб, водитель внутри, нога в крови."
      details: "Я проезжал мимо и остановился. Водитель в сознании, стонет."
      facts:
        danger: "Машина разбита, бензином не пахнет, не горит."
        traffic: "Машины объезжают по соседней полосе."
      victims: {has: true, count: 1}
      applicant: {status: witness}
    instructions:
      scene_safety:
        title: "Обозначить место: аварийная сигнализация, знак аварийной остановки, самому уйти с проезжей части"
        stems: ["аварийк", "аварийную сигнализ", "знак аварийн", "аварийный знак", "уйдите с проезж", "отойдите с дорог", "не стойте на дорог", "на обочин"]
        source: pdd
      first_aid:
        title: "Не перемещать пострадавшего без угрозы, остановить кровотечение — прижать рану тканью"
        stems: ["прижмите", "зажмите", "давящ", "жгут", "кровотечени", "не перемещайте", "не вытаскивайте", "не двигайте", "оставьте его в машин"]
        source: mz220
      pull_out:
        title: "«Вытащите его из машины» без угрозы пожара"
        stems: ["вытащите", "вытаскивайте", "достаньте его", "вынесите его", "извлеките", "вытянуть его"]
        harmful: true
        source: mz220
    start: start
    nodes:
      start:
        title: Водитель в разбитой машине
        situation: "Легковая врезалась в столб. Водитель в сознании, зажат, нога в крови. Заявитель стоит у машины на проезжей части."
        edges:
          - to: safe_scene
            when: {said: scene_safety}
            label: "Велели включить аварийку, выставить знак и уйти с проезжей части"
            effect: "Место ДТП обозначено, заявитель в безопасности"
            source: pdd
          - to: unsafe
            when: {after_s: 120}
            label: "О безопасности на дороге не сказали"
            effect: "Заявитель так и стоит на проезжей части"
            source: pdd
            note: didactic
      unsafe:
        title: Опасно на дороге
        situation: "Заявитель стоит на проезжей части у разбитой машины, машины объезжают впритык."
        event: "Тут машины объезжают впритык, меня чуть не задели!"
        escalate: 1
        gates: [danger]
        edges:
          - to: safe_scene
            when: {said: scene_safety}
            label: "Всё-таки велели обозначить место и уйти с проезжей части"
            effect: "Место ДТП обозначено"
            source: pdd
          - to: secondary
            when: {after_s: 210}
            label: "Место ДТП так и не обозначили"
            effect: "Вторичный наезд на месте аварии"
            source: pdd
            note: didactic
      safe_scene:
        title: Место обозначено
        situation: "Аварийка включена, знак выставлен, заявитель у обочины рядом с машиной. Водитель стонет, нога в крови."
        event: "Аварийку включил, знак поставил. Что с ним делать?"
        escalate: -1
        edges:
          - to: aided
            when: {said: first_aid}
            label: "Велели не перемещать и прижать рану тканью"
            effect: "Кровотечение остановлено, водитель в машине до приезда скорой"
            source: mz220
          - to: secondary
            when: {said: pull_out}
            label: "Велели вытащить водителя из машины"
            effect: "Пострадавшего извлекли без угрозы пожара — травма усугубилась"
            source: mz220
          - to: waiting
            when: {after_s: 240}
            label: "Как помочь пострадавшему, не объяснили"
            effect: "Кровотечение продолжается"
            source: mz220
            note: didactic
      aided:
        title: Кровотечение остановлено
        situation: "Заявитель прижимает рану на ноге водителя курткой, водитель в машине, в сознании."
        event: "Прижимаю рану курткой… кровь меньше. Он разговаривает."
        escalate: -1
        brigade:
          arrived: "Прибыли. Пострадавший в машине, кровотечение остановлено очевидцем — приступаем к извлечению."
        edges:
          - to: good
            when: {card_by_s: 150, service: S103}
            label: "Карточка со скорой ушла вовремя"
            effect: "Скорая забрала пострадавшего вовремя"
            source: mz388
          - to: late
            when: {after_s: 480}
            label: "Скорую направили поздно или без неё"
            effect: "Пострадавший долго ждал помощи"
            source: mz388
            note: didactic
      waiting:
        title: Кровотечение продолжается
        situation: "Водитель в машине, кровь не останавливается, заявитель растерян."
        event: "Кровь всё идёт… Он бледный стал!"
        escalate: 1
        brigade:
          arrived: "Прибыли. Пострадавший с большой кровопотерей, извлекаем."
        edges:
          - to: late
            when: {card_by_s: 150, service: S103}
            label: "Карточка со скорой ушла вовремя"
            effect: "Скорая приехала, но кровопотеря уже большая"
            source: mz388
          - to: secondary
            when: {after_s: 480}
            label: "Скорую направили поздно или без неё"
            effect: "Без первой помощи и со скорой поздно"
            source: mz388
            note: didactic
      good:
        title: Пострадавший у скорой
        brigade:
          works_completed: "Пострадавший извлечён и передан скорой, движение восстановлено."
        outcome:
          code: favorable
          text: "Место ДТП обозначено, кровотечение остановлено до приезда скорой, пострадавший госпитализирован вовремя, вторичных происшествий нет."
          sources: [pdd, mz220, mz388]
      late:
        title: Помощь с задержкой
        brigade:
          works_completed: "Пострадавший передан скорой в тяжёлом состоянии."
        outcome:
          code: partial
          text: "Пострадавший дождался скорой, но с задержкой первой помощи или самой скорой: большая кровопотеря, состояние тяжёлое."
          sources: [mz220, mz388]
      secondary:
        title: Ситуация ухудшилась
        brigade:
          arrived: "Прибыли. Пострадавших больше, чем в карточке, — нужна вторая бригада скорой."
        outcome:
          code: adverse
          text: "Ситуация ухудшилась: вторичный наезд на необозначенном месте ДТП или пострадавшего перемещали без угрозы пожара."
          sources: [pdd, mz220]
