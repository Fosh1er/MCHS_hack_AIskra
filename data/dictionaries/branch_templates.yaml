      ideal: {asked: {address: 20}, said: {scene_safety: 40, first_aid: 70}, card: {saved_s: 90, services: [S103, S102]}, expect: favorable}
      late_card: {asked: {address: 20}, said: {scene_safety: 40, first_aid: 70}, card: {saved_s: 300, services: [S103]}, expect: partial}
      pull_out: {asked: {address: 20}, said: {scene_safety: 40, pull_out: 70}, card: {saved_s: 90, services: [S103]}, expect: adverse}
