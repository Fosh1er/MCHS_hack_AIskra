# Метаданные колонок матрицы служб классификатора (Excel-колонки 15–90, нумерация с 1 — как в docs/brief/05).
# service  — код службы (services.yaml) или территориальная мета-служба (territorial*).
# flag     — признак карточки (enums.card_flag), при котором колонка применяется; null — базовая колонка службы.
# base     — поведение базовой колонки: exclusive — «признак не выбран» (применяется, если не выбран ни один признак
#            этой службы); always — применяется всегда (например, МГТС «реагирование всегда»).
# audience — card: служба на панели карточки; monitoring — гипотеза: информационный подписчик (не показывается
#            на панели служб стенда). Требует подтверждения заказчиком (см. specs/0.2 «Открытые вопросы»).
# header   — ожидаемый текст заголовка группы колонок: импорт сверяет его с xlsx и падает при расхождении.
