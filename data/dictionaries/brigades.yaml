# Справочник бригад и сил реагирования служб (п. 5.5, ответ заказчика #684: диспетчер ДДС вручную выбирает бригады
# и силы своей службы). Состава сил служб в данных заказчика нет — позывные и составы синтетические, учебные.
#
# Бригаду ищем сначала в by_service (перечень конкретной службы), иначе — в by_kind по виду службы (kind из
# services_*.yaml), иначе — default. code — позывной внутри службы; в базе ключ бригады «<служба>:<code>».
# crew — человек в расчёте. Импорт — вместе со справочниками (import-dictionaries).
