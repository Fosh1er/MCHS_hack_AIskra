# Справочник подчинённости объектов (пп. 4.4, 8.4 ТЗ): объект по адресу карточки → служба, которой он подчинён.
# Пример из ТЗ: школа → Департамент образования. Заказчик справочник не передал, поэтому правил нет и автоподбор
# служб работает только по классификатору и территории. Когда справочник появится — перенесите строки сюда,
# перезапустите сервер; код менять не нужно.
#
# Формат правила:
#   - match: [школ, гимназ, лице]   # начала слов в поле «Объект» карточки, без учёта регистра
#     service: <код службы>          # из services_core.yaml / services_territorial.yaml
#     note: Департамент образования  # кому подчинён объект — видно в причине подбора службы
rules: []
