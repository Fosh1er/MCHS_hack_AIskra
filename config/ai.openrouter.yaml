# Демо-стенд на бесплатных моделях OpenRouter (OpenAI-совместимый API). Только синтетические данные: запросы
# уходят во внешний сервис (ответ заказчика #710). В контуре заказчика — config/ai.example.yaml с локальной моделью.
#
# Подключение: в .env —
#   AISKRA_AI_CONFIG_PATH=<путь к этому файлу>   (в docker — /app/config/ai.openrouter.yaml)
#   AISKRA_AI_ALLOW_EXTERNAL=true
#   DEMO_LLM_API_KEY=<ключ OpenRouter>            ключ только в .env, не в этом файле
# Модели выбраны 27.09.2026 по https://openrouter.ai/api/v1/models (цена 0, поддержка JSON-ответа) и проверены
# запросом: qwen3.8-27b и gemma-4 в тот день были перегружены у поставщика (429 upstream), nemotron-3-super
# отвечал за 2 с чистым русским текстом при reasoning.enabled: false. Бесплатные модели OpenRouter меняются —
# при ошибке «model not found» или 429 замените имя в DEMO_LLM_MODEL / DEMO_SMALL_MODEL.
# Бесплатный аккаунт без пополнения — 50 запросов в сутки (реплика собеседника = 1 запрос).
# Лимиты бесплатного тарифа — порядка 20 запросов в минуту и ограниченное число в сутки: параллельность низкая.
ai:
  allow_external: ${AISKRA_AI_ALLOW_EXTERNAL:-false}
  default_provider: demo
  providers:
    # Генерация сценариев и ИИ-судья: JSON-ответ, хороший русский.
    demo:
      kind: openai_compatible
      base_url: ${DEMO_LLM_URL:-https://openrouter.ai/api/v1}
      api_key_env: DEMO_LLM_API_KEY
      model: ${DEMO_LLM_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      timeout_s: 90
      max_concurrency: 2
      structured_output: json_object
      extra_body: {reasoning: {enabled: false}}   # без рассуждений: ответ сразу, токены не тратятся на ход мысли
    # Реплики заявителя, старшего группы, диспетчера службы (запасной вариант — google/gemma-4-26b-a4b-it:free).
    demo_small:
      kind: openai_compatible
      base_url: ${DEMO_LLM_URL:-https://openrouter.ai/api/v1}
      api_key_env: DEMO_LLM_API_KEY
      model: ${DEMO_SMALL_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      timeout_s: 45
      max_concurrency: 2
      structured_output: json_object
      extra_body: {reasoning: {enabled: false}}
    fake: {kind: fake}
  cache: {backend: memory, max_items: 20000}
  tasks:
    probe:               {provider: demo,       temperature: 0,   cache: exact, cache_ttl: 1h}
    scenario_generation: {provider: demo,       temperature: 0.8, cache: off,   max_tokens: 2000}
    applicant_actor:     {provider: demo_small, temperature: 0.6, cache: task,  cache_ttl: 1d, max_tokens: 160}
    brigade_actor:       {provider: demo_small, temperature: 0.6, cache: task,  cache_ttl: 1d, max_tokens: 160}
    service_actor:       {provider: demo_small, temperature: 0.6, cache: task,  cache_ttl: 1d, max_tokens: 160}
    judge:               {provider: demo,       temperature: 0,   cache: exact, cache_ttl: 7d, max_tokens: 600}
    insights:            {provider: demo,       temperature: 0.3, cache: off}
  tts: {kind: fake, cache_ttl: 30d}
  # Голосовой ввод оператора (Whisper за OpenAI-совместимым /audio/transcriptions). Выключен, пока STT_KIND не задан.
  # Локально (GPU/CPU): Speaches — docs/ai/Голосовой_ввод.md; STT_URL=http://<машина с GPU>:8000/v1
  stt:
    kind: ${STT_KIND:-fake}          # openai_compatible — включить
    base_url: ${STT_URL:-http://whisper:8000/v1}
    api_key_env: STT_API_KEY         # для локального сервера не нужен
    model: ${STT_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}
    language: ru
    timeout_s: 30
