# Демо-стенд на моделях OpenRouter (OpenAI-совместимый API). Только синтетические данные: запросы
# уходят во внешний сервис (ответ заказчика #710). В контуре заказчика — config/ai.example.yaml с локальной моделью.
#
# Подключение: в .env —
#   AISKRA_AI_CONFIG_PATH=<путь к этому файлу>   (в docker — /app/config/ai.openrouter.yaml)
#   AISKRA_AI_ALLOW_EXTERNAL=true
#   DEMO_LLM_API_KEY=<ключ OpenRouter>            ключ только в .env, не в этом файле
#   TTS_KIND=openai_compatible                    голос собеседника (Gemini TTS, резерв — MAI Voice) — платно
#   STT_KIND=openai_compatible                    распознавание оператора (Qwen3-ASR, резерв — Whisper) — платно
# Голос и распознавание используют тот же ключ. Для проверки без ключа — локальные make dev-tts и make dev-stt
# (переменные STT_URL / TTS_URL), тот же адаптер: переключение — только переменными окружения.
# Модели выбраны командой 19.10.2026 (F3): LLM — openai/gpt-4o; TTS — google/gemini-3.8-flash-tts (голос Zephyr),
# резерв — microsoft/mai-voice-2.1-flash (ru-RU-Masha); STT — qwen/qwen3-asr-0.6b, резерв — openai/whisper-large-v3-turbo.
# Модели платные — поставьте лимит расходов на ключ. Любую можно заменить переменной окружения без правки файла.
ai:
  allow_external: ${AISKRA_AI_ALLOW_EXTERNAL:-false}
  default_provider: demo
  providers:
    # Генерация сценариев и ИИ-судья: JSON-ответ, хороший русский.
    demo:
      kind: openai_compatible
      base_url: ${DEMO_LLM_URL:-https://openrouter.ai/api/v1}
      api_key_env: DEMO_LLM_API_KEY
      model: ${DEMO_LLM_MODEL:-openai/gpt-4o}   # F3; альтернатива — Qwen flash
      timeout_s: 90
      max_concurrency: 2
      structured_output: json_object
      extra_body: {reasoning: {enabled: false}}   # без рассуждений: ответ сразу, токены не тратятся на ход мысли
    # Реплики заявителя, старшего группы, диспетчера службы (запасной вариант — google/gemma-4-26b-a4b-it:free).
    demo_small:
      kind: openai_compatible
      base_url: ${DEMO_LLM_URL:-https://openrouter.ai/api/v1}
      api_key_env: DEMO_LLM_API_KEY
      model: ${DEMO_SMALL_MODEL:-openai/gpt-4o}
      timeout_s: 45
      max_concurrency: 2
      structured_output: json_object
      extra_body: {reasoning: {enabled: false}}
    fake: {kind: fake}
  cache: {backend: memory, max_items: 20000}
  tasks:
    probe:               {provider: demo,       temperature: 0,   cache: exact, cache_ttl: 1h}
    scenario_generation: {provider: demo,       temperature: 0.8, cache: off,   max_tokens: 2000}
    applicant_actor:     {provider: demo_small, temperature: 0.6, cache: task,  cache_ttl: 1d, max_tokens: 160, prompt_version: v2}
    brigade_actor:       {provider: demo_small, temperature: 0.6, cache: task,  cache_ttl: 1d, max_tokens: 160}
    service_actor:       {provider: demo_small, temperature: 0.6, cache: task,  cache_ttl: 1d, max_tokens: 160}
    judge:               {provider: demo,       temperature: 0,   cache: exact, cache_ttl: 7d, max_tokens: 600}
    insights:            {provider: demo,       temperature: 0.3, cache: off}
    psy_acts:            {provider: demo_small, temperature: 0,   cache: exact, cache_ttl: 7d, max_tokens: 300}
    psy_judge:           {provider: demo, temperature: 0,   cache: exact, cache_ttl: 7d, max_tokens: 700}
    branch_texts:        {provider: demo,       temperature: 0.7, cache: off, max_tokens: 700}
    feedback_draft:      {provider: demo,       temperature: 0.4, cache: off, max_tokens: 700}
  # Голос собеседника (п. 3.6): Gemini TTS через OpenRouter — эмоция передаётся стилем (speech_metadata.style), голос — по роли.
  # Синтез на OpenRouter ПЛАТНЫЙ (по символам; 29.09.2026 — доли цента за реплику): нужен пополненный счёт.
  # Выключен, пока TTS_KIND не задан, — тогда реплики озвучивает браузер.
  tts:
    kind: ${TTS_KIND:-fake}          # openai_compatible — включить
    base_url: ${TTS_URL:-https://openrouter.ai/api/v1}
    api_key_env: DEMO_LLM_API_KEY    # тот же ключ OpenRouter
    model: ${TTS_MODEL:-google/gemini-3.8-flash-tts}   # F3: выбрана командой 19.10.2026
    style: ${TTS_STYLE:-google}      # google | openai | none
    response_format: ${TTS_FORMAT:-pcm}   # Gemini отдаёт сырой звук 24 кГц — сервер оборачивает его в WAV
    voice: ${TTS_VOICE:-Zephyr}
    voices:
      applicant_female: ${TTS_VOICE_FEMALE:-Zephyr}
      applicant_male: ${TTS_VOICE_MALE:-Charon}
      brigade: ${TTS_VOICE_BRIGADE:-Orus}
      service: ${TTS_VOICE_SERVICE:-Aoede}
    cache_ttl: 30d
    cache_mb: 64
    max_concurrency: 2
    timeout_s: 30
    # F3: основная не ответила — синтез резервной моделью (тот же ключ). Отключить: TTS_FALLBACK_MODEL= (пусто)
    fallback:
      model: ${TTS_FALLBACK_MODEL:-microsoft/mai-voice-2.1-flash}
      voice: ${TTS_FALLBACK_VOICE:-ru-RU-Masha:MAI-Voice-2.1-Flash}
      style: none                    # эмоция — темпом; стиль Gemini резервная модель не понимает
      response_format: ${TTS_FALLBACK_FORMAT:-mp3}
      timeout_s: 30
  # Голосовой ввод оператора: Whisper через OpenRouter (/audio/transcriptions, multipart — тот же адаптер, что для
  # локального Whisper). whisper-large-v3-turbo — по цене 29.09.2026 около 0,0002 $ за минуту звука, в 30 раз дешевле
  # whisper-1. Выключен, пока STT_KIND не задан. Локально: STT_URL=http://localhost:8200/v1 (make dev-stt) или Speaches.
  stt:
    kind: ${STT_KIND:-fake}          # openai_compatible — включить
    base_url: ${STT_URL:-https://openrouter.ai/api/v1}
    api_key_env: DEMO_LLM_API_KEY    # тот же ключ OpenRouter; локальному серверу он не нужен
    model: ${STT_MODEL:-qwen/qwen3-asr-0.6b}                         # F3: основная
    fallback_model: ${STT_FALLBACK_MODEL:-openai/whisper-large-v3-turbo}   # F3: при сбое основной
    language: ru
    timeout_s: 30
