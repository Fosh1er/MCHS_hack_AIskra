# Конфигурация ИИ-слоя (ADR-0003, ADR-0006). По умолчанию — полностью офлайн: fake-модель.
# Примеры подключения демо-API и локальной модели — config/ai.example.yaml.
# Секреты и адреса — только через переменные окружения: ${VAR} или ${VAR:-значение_по_умолчанию}.
ai:
  allow_external: false          # изолированный контур: внешние адреса моделей запрещены
  default_provider: fake
  providers:
    fake: {kind: fake, model: fake-llm}
  cache:
    backend: memory              # memory | off
    max_items: 5000
  tasks:
    probe:               {provider: fake, temperature: 0,   cache: exact, cache_ttl: 1h}
    scenario_generation: {provider: fake, temperature: 0.8, cache: off}
    applicant_actor:     {provider: fake, temperature: 0.6, cache: task,  cache_ttl: 1d}
    brigade_actor:       {provider: fake, temperature: 0.6, cache: task,  cache_ttl: 1d}
    service_actor:       {provider: fake, temperature: 0.6, cache: task,  cache_ttl: 1d}
    judge:               {provider: fake, temperature: 0,   cache: exact, cache_ttl: 7d}
    insights:            {provider: fake, temperature: 0.3, cache: off}
  tts: {kind: fake, cache_ttl: 30d}
  # Голосовой ввод оператора (Whisper за OpenAI-совместимым /audio/transcriptions). Выключен, пока STT_KIND не задан.
  # Локально (GPU/CPU): Speaches — docs/ai/Голосовой_ввод.md; STT_URL=http://<машина с GPU>:8000/v1
  stt:
    kind: ${STT_KIND:-fake}          # openai_compatible — включить
    base_url: ${STT_URL:-http://whisper:8000/v1}
    api_key_env: STT_API_KEY         # для локального сервера не нужен
    model: ${STT_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}
    language: ru
    timeout_s: 30
