# Пример: демо на внешнем OpenAI-совместимом API + локальная модель в контуре заказчика.
# Скопируйте в config/ai.yaml и задайте переменные окружения (.env).
ai:
  # На демо-стенде допускается внешний API (ответ заказчика #710). В контуре заказчика — false.
  allow_external: ${AISKRA_AI_ALLOW_EXTERNAL:-false}
  default_provider: local
  providers:
    # Локальная модель: Ollama / vLLM / llama.cpp server (профиль docker compose `local-llm`).
    local:
      kind: openai_compatible
      base_url: ${LOCAL_LLM_URL:-http://ollama:11434/v1}
      model: ${LOCAL_LLM_MODEL:-qwen2.5:7b-instruct}
      timeout_s: 120
      max_concurrency: 2            # CPU без GPU: не больше 2 параллельных генераций
      structured_output: json_object
    # Малая быстрая модель для реплик актёров (заявитель, старший группы).
    local_small:
      kind: openai_compatible
      base_url: ${LOCAL_LLM_URL:-http://ollama:11434/v1}
      model: ${LOCAL_SMALL_MODEL:-qwen2.5:3b-instruct}
      timeout_s: 30
      max_concurrency: 4
      structured_output: json_object
    # Внешний демо-API (любой OpenAI-совместимый). Ключ — в переменной окружения, не в файле.
    demo:
      kind: openai_compatible
      base_url: ${DEMO_LLM_URL:-https://example.invalid/v1}
      api_key_env: DEMO_LLM_API_KEY
      model: ${DEMO_LLM_MODEL:-demo-model}
      timeout_s: 60
      max_concurrency: 8
    fake: {kind: fake}
  cache: {backend: memory, max_items: 20000}
  tasks:
    probe:               {provider: local,       temperature: 0,   cache: exact, cache_ttl: 1h}
    scenario_generation: {provider: local,       temperature: 0.8, cache: off, max_tokens: 2000}
    applicant_actor:     {provider: local_small, temperature: 0.6, cache: task,  cache_ttl: 1d, max_tokens: 160, prompt_version: v2}
    brigade_actor:       {provider: local_small, temperature: 0.6, cache: task,  cache_ttl: 1d, max_tokens: 160}
    service_actor:       {provider: local_small, temperature: 0.6, cache: task,  cache_ttl: 1d, max_tokens: 160}
    judge:               {provider: local,       temperature: 0,   cache: exact, cache_ttl: 7d, max_tokens: 600}
    insights:            {provider: local,       temperature: 0.3, cache: off}
    psy_acts:            {provider: local_small, temperature: 0,   cache: exact, cache_ttl: 7d, max_tokens: 300}
    psy_judge:           {provider: local, temperature: 0,   cache: exact, cache_ttl: 7d, max_tokens: 700}
    feedback_draft:      {provider: local,       temperature: 0.4, cache: off, max_tokens: 700}
  # Голос собеседника (п. 3.6): серверный синтез за OpenAI-совместимым /audio/speech. Выключен, пока TTS_KIND не задан, —
  # тогда реплики озвучивает браузер (темп, высота, громкость по состоянию заявителя).
  # Изолированный контур: Speaches с Piper на CPU (speaches-ai/piper-ru_RU-irina|denis|dmitri|ruslan-medium), TTS_STYLE=none —
  # эмоция передаётся только темпом. Демо с эмоциональным голосом — config/ai.openrouter.yaml.
  # Проверка на macOS без ключей и Docker: make dev-tts (голос системы), TTS_KIND=openai_compatible TTS_URL=http://localhost:8100/v1
  tts:
    kind: ${TTS_KIND:-fake}          # openai_compatible — включить
    base_url: ${TTS_URL:-http://speaches:8000/v1}
    api_key_env: TTS_API_KEY         # для локального сервера не нужен
    model: ${TTS_MODEL:-speaches-ai/piper-ru_RU-irina-medium}
    style: ${TTS_STYLE:-none}        # google | openai | none
    response_format: ${TTS_FORMAT:-mp3}
    voice: ${TTS_VOICE:-}            # голос по умолчанию; роли ниже без имени получают его
    voices:
      applicant_female: ${TTS_VOICE_FEMALE:-}
      applicant_male: ${TTS_VOICE_MALE:-}
      brigade: ${TTS_VOICE_BRIGADE:-}
      service: ${TTS_VOICE_SERVICE:-}
    cache_ttl: 30d
    cache_mb: 64                     # лимит кеша аудио в памяти процесса
    max_concurrency: 2
    timeout_s: 20
  # Голосовой ввод оператора (Whisper за OpenAI-совместимым /audio/transcriptions). Выключен, пока STT_KIND не задан.
  # Локально (GPU/CPU): Speaches — docs/ai/Голосовой_ввод.md; STT_URL=http://<машина с GPU>:8000/v1
  stt:
    kind: ${STT_KIND:-fake}          # openai_compatible — включить
    base_url: ${STT_URL:-http://whisper:8000/v1}
    api_key_env: STT_API_KEY         # для локального сервера не нужен
    model: ${STT_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}
    language: ru
    timeout_s: 30
