server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 20m;

  # X-Forwarded-For: реальный IP клиента для журнала аудита (uvicorn --proxy-headers)
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_read_timeout 180s; }
  location /ws/  { proxy_pass http://backend:8000; proxy_http_version 1.1;
                   proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location = /health { proxy_pass http://backend:8000; }
  location ~ ^/(docs|openapi.json) { proxy_pass http://backend:8000; }
  location / { try_files $uri /index.html; }
}
