# АИскра: локальный контур. Запуск: docker compose up --build
# Профиль local-llm добавляет Ollama (локальная модель на CPU/GPU): docker compose --profile local-llm up
name: aiskra

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aiskra
      POSTGRES_USER: aiskra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiskra}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiskra -d aiskra"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: [{path: .env, required: false}]
    environment:
      AISKRA_DATABASE_URL: postgresql+asyncpg://aiskra:${POSTGRES_PASSWORD:-aiskra}@db:5432/aiskra
      AISKRA_AI_CONFIG_PATH: /app/config/ai.yaml
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data:ro
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ["8080:80"]
    depends_on: [backend]
    restart: unless-stopped

  ollama:
    profiles: [local-llm]
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
    deploy:
      resources:
        limits: {cpus: "4"}   # ТЗ: сервер 6 ядер без GPU — оставляем ядра API и БД
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
